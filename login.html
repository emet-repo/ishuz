<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ishuz — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page_wrapper">

  <div id="page_header">
    <h2>Ishuz</h2>
    <h3>Login to your account</h3>
  </div>

  <div id="menu_bar">
    <nav id="navcontainer">
      <ul id="navlist">
        <li><a href="index.html">Home</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="forget.html">Forgot password?</a></li>
      </ul>
    </nav>
  </div>

  <div id="content_wrapper">
    <div id="left_side"></div>

    <div id="center">
      <div class="form-page">
        <h2>Welcome back to <a href="index.html">Ishuz</a></h2>
        <p class="sub">Don't have an account? <a href="register.html">Register here</a></p>

        <div id="msg" class="msg" role="alert"></div>

        <form id="login_form" novalidate>
          <div class="field-group required">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username"
                   placeholder="Your Ishuz username" maxlength="12">
          </div>

          <div class="field-group required">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password"
                   placeholder="••••••••">
          </div>

          <button type="submit" class="full-btn" id="login_btn">Login</button>
        </form>

        <div class="form-links">
          <a href="forget.html">Forgot your password?</a>
        </div>
      </div>
    </div>

    <div id="right_side"></div>
  </div>

  <div id="page_footer">
    <p>Ishuz — Collective Intelligence &bull; <a href="index.html" style="color:#7aaac8">Home</a></p>
  </div>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
